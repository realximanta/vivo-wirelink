# language: yaml, file: backend/render.yaml
# Render Blueprint — optional but lets you spin up the service from a single click.
# language: yaml, file: backend/render.yaml
services:
  - type: web
    name: vivo-wirelink
    runtime: go
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: go build -o server .
    startCommand: ./server
    healthCheckPath: /ping
    autoDeploy: false
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
