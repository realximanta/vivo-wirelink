# language: yaml, file: backend/render.yaml
# Render Blueprint — optional but lets you spin up the service from a single click.
services:
  - type: web
    name: vivo-wirelink
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /ping
    autoDeploy: false
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
