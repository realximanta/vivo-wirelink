# language: yaml, file: backend/render.yaml
services:
  - type: web
    name: vivo-wirelink
    runtime: go
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: go mod tidy && go build -o server .
    startCommand: ./server
    healthCheckPath: /ping
    autoDeploy: false
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
